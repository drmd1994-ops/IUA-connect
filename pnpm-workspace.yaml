packages:
  - apps/*
  - packages/*
  - tools/importer

# pnpm 10 blocks dependency lifecycle scripts by default. Only these are allowed to build.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Reviewed and intentionally not run: telemetry (scarf) and an optional native file watcher.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'

# Security overrides for transitive dependencies of the Prisma CLI (dev tooling only).
# Remove when Prisma ships patched versions. Reviewed 2026-09-27.
overrides:
  mysql2: '>=3.23.1 <4'
  # Security fix (GHSA-xcpc-8h2w-3j85, GHSA-7q85-xj36-vmfc and a third high adm-zip advisory, <0.6.1,
  # crafted zip files exhausting memory) for dcmjs 0.52.2 (M36), which lists adm-zip but whose built
  # code never loads it. Remove when dcmjs asks for a patched version.
  adm-zip: 0.6.1
  deepmerge-ts: '>=8.0.0 <9'
  # Security fixes for @nestjs/platform-express 11.2.5: multer <2.5.0 (GHSA-q7qp-rjg7-q26m and
  # earlier) and body-parser <2.4.0 (GHSA-27r3-jxmh-p828), requests that can slow the API down.
  multer: '>=2.5.0 <3'
  body-parser: '>=2.4.0 <3'
  # Security fix (GHSA-pqg4-j6r4-53mv, shell-quote <1.11.0, command injection) for the React Native
  # developer tools, which are not part of the app on a phone. 1.11.0 exactly: 1.12.0 was less than
  # seven days old on 2026-10-06. Remove when React Native ships a patched version.
  shell-quote: 1.11.0
  # Security fix (GHSA-68fv-2mgg-jv7q, source-map-js <1.2.2, a crafted source map can stall the
  # process) for vite > postcss, the test runner's tooling. Remove when postcss asks for it itself.
  source-map-js: 1.2.2
  # Security fix (GHSA-8r5x-fm3f-whwj and a second critical handlebars advisory, <=4.7.9) for
  # ts-jest, the server's test runner; nothing of it runs in the product. Remove when ts-jest asks
  # for 4.7.10 or later itself.
  handlebars: '>=4.7.10 <5'
  # Security fix (GHSA-xjj6-f33q-929c, undici <7.30.1, an error on excessive content encodings) for
  # tools/importer > cheerio, the unused importer. Remove when cheerio asks for it itself.
  'undici@>=7.18.0 <7.30.1': 7.30.1
  # Peers that pnpm auto-installs at the newest release, ignoring minimumReleaseAge.
  # Keep these in step with the versions the workspace declares.
  '@types/node': 24.13.6
  prettier: 3.9.8
  vite: 8.3.4

# Supply-chain protections (flagged by Semgrep):
# - wait 7 days before installing a newly published version (most malicious releases are pulled sooner)
# - transitive dependencies may only come from the registry (no git/tarball URLs)
# - refuse a version whose publishing trust level is lower than earlier versions
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

# semver 6.3.1 is npm's 2023 security backport to the v6 line, published after provenance-signed
# v7 releases, so the date-based trust check flags it. Reviewed 2026-09-27: legitimate.
trustPolicyExclude:
  - 'semver@6.3.1'

# Advisories accepted in `pnpm audit`, each with its reason. Remove an entry as soon as a fixed
# version exists. Any other advisory still fails the security job.
# - GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, stack exhaustion on deeply nested patterns): no fixed
#   version published. Reached only through @next/eslint-plugin-next > fast-glob > micromatch,
#   which runs at lint time on patterns from this repository's own configuration, never on
#   input from a visitor. Accepted by the owner on 2026-10-03.
# - GHSA-86w9-cpqp-85rv (node-forge <=1.4.0, a malformed RSA signature is accepted): no fixed
#   version published. Reached only through expo > @expo/cli, the developer's command-line tool
#   for the mobile app, which runs on the developer's computer and in CI. It is not part of the
#   app that runs on a phone, nor of the API or the site. Accepted by the owner on 2026-10-05.
# - GHSA-mrhx-c7xc-m3w5 (zod <4.6.6, oversized input can exhaust memory): the workspace's own zod
#   is 4.6.6, but expo > @expo/cli uses zod 3.25.76, and no fixed 3.x exists. @expo/cli is the
#   developer's command-line tool for the mobile app (on the developer's computer and in CI), not
#   part of the app on a phone, the API or the site. Accepted by the owner on 2026-10-24; remove
#   when Expo moves to a fixed zod.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv
    - GHSA-mrhx-c7xc-m3w5
