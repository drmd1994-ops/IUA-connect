name: CI

# lint → typecheck → unit → integration → security + e2e + zap → build (DEVELOPMENT_ROADMAP.md §2)
on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (supply-chain safety); the comment shows the tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Generated API client is up to date
        run: |
          pnpm openapi:generate
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm openapi:generate' and commit the result."
            exit 1
          }

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the deny-by-default gate: every route must declare @Public() or @RequirePermission().
      - run: pnpm test

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database only.
      PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DB_NAME: iua_connect
      DB_TEST_NAME: iua_connect_test
      DB_OWNER_USER: iua_owner
      DB_OWNER_PASSWORD: ci_owner_password
      DB_APP_USER: iua_app
      DB_APP_PASSWORD: ci_app_password
      TEST_DATABASE_URL: postgresql://iua_app:ci_app_password@localhost:5432/iua_connect_test
      TEST_MIGRATION_DATABASE_URL: postgresql://iua_owner:ci_owner_password@localhost:5432/iua_connect_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:provision
      - run: pnpm test:integration

  security:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the list of commits in a pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan of the full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --config p/typescript --error --metrics=off
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same setup as a developer machine: .env with generated keys, roles, databases, seed.
      - name: Set up the environment
        run: |
          cp .env.example .env
          sed -i 's#^PG_SUPERUSER_URL=.*#PG_SUPERUSER_URL=postgresql://postgres:postgres@localhost:5432/postgres#' .env
          pnpm setup:dev
      - run: pnpm --filter @iua/web exec playwright install --with-deps chromium
      - run: pnpm build
      # Sign-up/sign-in journeys and WCAG 2.2 AA checks (Chromium) against the production builds.
      - run: pnpm --filter @iua/web e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # OWASP ZAP baseline (M9): a passive scan of the running site and API. It spiders the pages and
  # reads the responses (headers, cookies, leaks); it attacks nothing. Rules that are accepted
  # are listed, each with its reason, in .zap/rules.tsv and docs/security/ZAP_BASELINE.md.
  zap:
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up the environment
        run: |
          cp .env.example .env
          sed -i 's#^PG_SUPERUSER_URL=.*#PG_SUPERUSER_URL=postgresql://postgres:postgres@localhost:5432/postgres#' .env
          pnpm setup:dev
      - run: pnpm build
      - name: Start the API and the web app (production builds)
        run: |
          pnpm --filter @iua/api start > api.log 2>&1 &
          pnpm --filter @iua/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health/ready > /dev/null && curl -sf http://localhost:3001/he > /dev/null; then exit 0; fi
            sleep 2
          done
          cat api.log web.log
          exit 1
      - name: ZAP baseline, the web app
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3001
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web
      - name: ZAP baseline, the API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:4000/api/v1/news
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api

  build:
    needs: [security, e2e, zap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
