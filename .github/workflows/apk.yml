name: Demo APK

# Builds the phone app as an Android .apk for the demo (docs/plans/M14-mobile-app.md, amendment 2).
# It is not part of CI: it runs when asked for, or when a branch named apk/... is pushed.
# The .apk is signed with the debug key that every Android project starts with, so it installs on
# a phone but can't go to an app store. The server's address is built into it.
on:
  workflow_dispatch:
  push:
    branches: ['apk/**']

# Actions are pinned to full commit SHAs (supply-chain safety); the comment shows the tag.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Where the app finds the demo server and the site. Kept as repository variables, not in
      # the code: whoever has the server's address can reach the demo while its tunnel runs.
      EXPO_PUBLIC_API_URL: ${{ vars.DEMO_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.DEMO_WEB_URL }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: The server's address is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable DEMO_API_URL to the demo server's address."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Build the packages the app uses
        run: pnpm --filter "@medconnect/mobile^..." build
      - name: Make the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      # The app's own signing key (M18b): the site names it for passkeys and links. Kept only as
      # secrets; the file lives outside the project for the build and is removed after it.
      - name: The signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medconnect.p12"
          sha256sum "$RUNNER_TEMP/medconnect.p12" | cut -c1-16
      # Java must open it, or the build would fail only at its end, many minutes later.
      - name: The signing key opens
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "password length: ${#STORE_PASSWORD}"
          openssl pkcs12 -in "$RUNNER_TEMP/medconnect.p12" -passin env:STORE_PASSWORD -info -noout \
            && echo "openssl opens it"
          keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/medconnect.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS"
      - name: Build the .apk
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_medconnectStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_medconnectKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
        # One processor kind, the one phones of the last years have; it halves the build.
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon \
            -PmedconnectStoreFile="$RUNNER_TEMP/medconnect.p12"
      - name: The .apk is signed with the app's key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          signer=$("$apksigner" verify --print-certs \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk | grep 'SHA-256')
          echo "$signer"
          expected=$(tr -d ':' <<< "$ANDROID_CERT_SHA256" | tr 'A-F' 'a-f')
          grep -q "$expected" <<< "$signer" || { echo "::error::Not signed with the app's key."; exit 1; }
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/medconnect.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: med-connect-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
