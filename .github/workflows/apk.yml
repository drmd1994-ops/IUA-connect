name: Demo APK

# Builds the phone app as an Android .apk for the demo (docs/plans/M14-mobile-app.md, amendment 2).
# It is not part of CI: it runs when asked for, or when a branch named apk/... is pushed.
# The .apk is signed with the debug key that every Android project starts with, so it installs on
# a phone but can't go to an app store. The server's address is built into it.
on:
  workflow_dispatch:
  push:
    branches: ['apk/**']

# Actions are pinned to full commit SHAs (supply-chain safety); the comment shows the tag.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Where the app finds the demo server and the site. Kept as repository variables, not in
      # the code: whoever has the server's address can reach the demo while its tunnel runs.
      EXPO_PUBLIC_API_URL: ${{ vars.DEMO_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.DEMO_WEB_URL }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: The server's address is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable DEMO_API_URL to the demo server's address."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Build the packages the app uses
        run: pnpm --filter "@iua/mobile^..." build
      - name: Make the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the .apk
        working-directory: apps/mobile/android
        # One processor kind, the one phones of the last years have; it halves the build.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: med-connect-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
